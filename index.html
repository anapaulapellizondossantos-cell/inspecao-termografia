<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Termografia</title>
<style>
:root{--bg:#f1efed;--card:#fff;--ink:#1c1917;--mut:#6b6460;--line:#e7e2de;--ok:#15803d;--nc:#b91c1c;--acc:#f97316;--hd:#1c1410;--p1:#dc2626;--p2:#ea8a0c;--p3:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;display:flex;align-items:center;gap:4px;min-height:58px}
header .t{flex:1;min-width:0;padding:0 6px}
header h1{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .s{font-size:12.5px;color:#d6cfc9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:#fff;font-size:24px;width:46px;height:46px;border-radius:12px;flex:none}
.ib:active{background:rgba(255,255,255,.12)}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#facc15,#f97316 55%,#dc2626);display:grid;place-items:center;font-weight:900;margin-left:6px;flex:none;color:#fff;font-size:18px}
main{padding:12px 12px calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(28,25,23,.08)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:0 0 5px;text-transform:uppercase;letter-spacing:.03em}
.i{width:100%;font-size:17px;padding:12px;border:1.5px solid #d6d0cb;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
.i:focus{outline:none;border-color:var(--hd);box-shadow:0 0 0 3px rgba(249,115,22,.35)}
.i.num{font-size:22px;font-weight:700;text-align:center;padding:10px 6px}
textarea.i{min-height:70px;resize:vertical;font-size:15.5px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.mb{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid #d6d0cb;background:#fff;border-radius:999px;padding:8px 13px;font-size:15px;min-height:42px;line-height:1.1}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.chip.sm{min-height:36px;padding:6px 11px;font-size:14px}
.chip.more{border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-size:16.5px;font-weight:700;min-height:52px;background:#e7e2de;color:var(--ink)}
.btn:active{filter:brightness(.92)}
.btn.pri{background:var(--hd);color:#fff}.btn.acc{background:var(--acc);color:#fff}.btn.red{background:var(--nc);color:#fff}
.btn.blk{width:100%}.btn.sm{min-height:42px;font-size:15px;padding:8px 12px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
#bar:empty{display:none}
#bar>*{flex:1;max-width:380px}
.it-l{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 2px rgba(28,25,23,.08);width:100%;border:0;text-align:left}
.it-l .n{font-weight:800;color:var(--mut);min-width:26px;font-size:15px}
.it-l .m{flex:1;min-width:0}.it-l .m b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-l .m span{font-size:13.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-l .tt{font-weight:800;font-size:17px;white-space:nowrap}
.bd{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;border-radius:7px;font-size:12.5px;font-weight:800;padding:0 7px;color:#fff;margin-left:4px;white-space:nowrap}
.bd.p1{background:var(--p1)}.bd.p2{background:var(--p2)}.bd.p3{background:var(--p3)}.bd.ok{background:var(--ok)}.bd.wn{background:#a8a29e}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{flex:1;min-width:64px;background:#faf8f6;border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11.5px;color:var(--mut);font-weight:700}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.sec::after{content:"";flex:1;height:1px;background:#d6d0cb}
.ph{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{width:66px;height:66px;border-radius:10px;object-fit:cover;background:#e7e2de;border:1px solid var(--line)}
.camb{height:66px;min-width:66px;padding:0 12px;border-radius:10px;border:2px dashed #a8a29e;background:#faf8f6;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.res{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#faf8f6;border:2px solid var(--line)}
.res.P1{border-color:var(--p1);background:#fef2f2}.res.P2{border-color:var(--p2);background:#fff7ed}.res.P3{border-color:var(--p3);background:#eff6ff}.res.N{border-color:var(--ok);background:#f0fdf4}
.res .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.res .g div{background:#fff;border-radius:9px;padding:6px;text-align:center}
.res .g b{display:block;font-size:18px}.res .g span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
.cls{display:flex;gap:6px;flex-wrap:wrap}
.cls button{flex:1;min-width:72px;height:44px;border-radius:10px;border:1.5px solid #d6d0cb;background:#fff;font-weight:800;font-size:13.5px}
.cls button.on.P1{background:var(--p1);border-color:var(--p1);color:#fff}
.cls button.on.P2{background:var(--p2);border-color:var(--p2);color:#fff}
.cls button.on.P3{background:var(--p3);border-color:var(--p3);color:#fff}
.cls button.on.N{background:var(--ok);border-color:var(--ok);color:#fff}
.cls button .sg{display:block;font-size:10px;font-weight:700;opacity:.8}
.warn{font-size:13px;color:#9a3412;background:#ffedd5;border-radius:8px;padding:6px 9px;margin-top:8px}
.hint{font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1c1917;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(28,25,23,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#modal h3{margin:0 0 8px;font-size:19px}
#modal h4{margin:14px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
#modal p{margin:0 0 14px;color:#44403c}
#modal .acts{display:flex;flex-direction:column;gap:8px}
#modal img.full{width:100%;border-radius:12px;margin-bottom:12px;max-height:65vh;object-fit:contain;background:#000}
.srch{margin-bottom:10px}
.unit{position:relative}.unit::after{content:attr(data-u);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--mut);font-weight:700;pointer-events:none}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div id="bar"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
'use strict';
/* =========================================================
   CATÁLOGO — equipamentos, MTA de referência, causas e recomendações
   ========================================================= */
const EQ_GRUPOS=[
 {n:'Cabos e conexões',it:[
  {id:'cab_pvc',n:'Cabo PVC 70 °C 450/750 V',mta:70},
  {id:'cab_pvc1k',n:'Cabo PVC 70 °C 0,6/1 kV',mta:70},
  {id:'cab_hepr',n:'Cabo HEPR 90 °C 0,6/1 kV',mta:90},
  {id:'cab_epr',n:'Cabo EPR/XLPE 90 °C 0,6/1 kV',mta:90},
  {id:'cab_mt90',n:'Cabo MT EPR/XLPE 90 °C',mta:90},
  {id:'cab_mt105',n:'Cabo MT EPR 105 °C',mta:105},
  {id:'term',n:'Terminal / conexão de cabo',mta:null,h:'Use a MTA do cabo conectado (70 °C PVC · 90 °C HEPR/EPR/XLPE).',cab:true},
  {id:'barr',n:'Barramento / conexão de barra',mta:null,h:'MTA conforme fabricante do painel/barramento.'},
  {id:'borne',n:'Borne / régua de bornes',mta:null}
 ]},
 {n:'Proteção e manobra',it:[
  {id:'dj_din',n:'Minidisjuntor (DIN)',mta:null},
  {id:'dj_cx',n:'Disjuntor caixa moldada',mta:null},
  {id:'dj_ab',n:'Disjuntor aberto (BT potência)',mta:null},
  {id:'dr',n:'DR / IDR',mta:null},
  {id:'fus_nh',n:'Fusível NH / base',mta:null},
  {id:'fus_dz',n:'Fusível Diazed / Neozed',mta:null},
  {id:'secc',n:'Seccionadora / chave',mta:null},
  {id:'cont',n:'Contator',mta:null},
  {id:'rele',n:'Relé térmico / disjuntor-motor',mta:null},
  {id:'dps',n:'DPS',mta:null}
 ]},
 {n:'Acionamentos e cargas',it:[
  {id:'inv',n:'Inversor de frequência',mta:null},
  {id:'soft',n:'Soft-starter',mta:null},
  {id:'mot',n:'Motor (caixa de ligação/carcaça)',mta:null,ins:true,h:'Carcaça: conforme fabricante. Enrolamento: classe de isolação.'},
  {id:'tom',n:'Tomada / plugue industrial',mta:null}
 ]},
 {n:'Potência',it:[
  {id:'trf_oleo',n:'Transformador a óleo',mta:null,ins:true,h:'Buchas/conexões e topo do óleo: conforme placa e fabricante.'},
  {id:'trf_seco',n:'Transformador a seco',mta:null,ins:true,h:'Use a classe de isolação da placa (F 155 °C · H 180 °C).'},
  {id:'cap',n:'Capacitor / banco',mta:null},
  {id:'reat',n:'Reator / indutor',mta:null,ins:true},
  {id:'tctp',n:'TC / TP',mta:null},
  {id:'out',n:'Outro',mta:null}
 ]}
];
const EQ=Object.fromEntries(EQ_GRUPOS.flatMap(g=>g.it).map(e=>[e.id,e]));
const CLASSES=[['A',105],['E',120],['B',130],['F',155],['H',180]];
const FASES=['R','S','T','N','PE','3F'];
const LOCAIS=['Conexão entrada','Conexão saída','Corpo','Cabo junto ao terminal','Barramento','Outro'];
const CAUSAS=[
 {id:'cont',n:'Mau contato / aperto',r:'Desenergizar, limpar e reapertar a conexão com o torque do fabricante.'},
 {id:'oxi',n:'Oxidação',r:'Limpar ou substituir a conexão oxidada; aplicar composto antioxidante quando aplicável.'},
 {id:'term',n:'Terminal inadequado',r:'Substituir o terminal por modelo compatível, com crimpagem adequada.'},
 {id:'sobre',n:'Sobrecarga',r:'Medir a corrente e verificar o dimensionamento do circuito e da proteção.'},
 {id:'deseq',n:'Desequilíbrio de fases',r:'Redistribuir as cargas entre as fases.'},
 {id:'sub',n:'Subdimensionado',r:'Redimensionar o componente/condutor para a corrente de projeto.'},
 {id:'harm',n:'Harmônicas (neutro)',r:'Avaliar harmônicas e o dimensionamento do neutro.'},
 {id:'def',n:'Componente defeituoso',r:'Substituir o componente.'},
 {id:'vent',n:'Ventilação deficiente',r:'Melhorar a ventilação/arrefecimento do painel.'}
];
const CA=Object.fromEntries(CAUSAS.map(c=>[c.id,c]));
const REINSP='Reinspecionar por termografia após a correção.';
const CL={P1:{n:'Imediata',c:'p1'},P2:{n:'Programada',c:'p2'},P3:{n:'Monitorar',c:'p3'},N:{n:'Normal',c:'ok'}};
const RANK={N:0,P3:1,P2:2,P1:3};
const CRITERIO='Classificação sugerida = a mais severa entre: (1) MTA: T avaliada ≥ MTA → Imediata; até 10 °C abaixo da MTA → Programada. (2) ΔT entre componentes similares (NETA MTS, tab. 100.18): >15 °C Imediata; 4–15 °C Programada; 1–3 °C Monitorar. (3) ΔT sobre o ambiente (adaptado da NETA): >40 °C Imediata; 21–40 °C Programada; 11–20 °C Monitorar. T avaliada = T corrigida para a corrente nominal quando informadas I medida e I nominal: Tamb + (Tmáx − Tamb)·(In/Imed)². A classificação final é do inspetor.';

/* ========================================================= utilidades */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtData=s=>s?s.split('-').reverse().join('/'):'';
const LS={get(k,d){try{const v=localStorage.getItem('termo.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('termo.'+k,JSON.stringify(v))}catch{}}};
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const f1=v=>v==null?'':(Math.round(v*10)/10).toLocaleString('pt-BR');
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function vib(){try{navigator.vibrate&&navigator.vibrate(12)}catch{}}

/* ========================================================= cálculo */
function calc(a,p){
 const tmax=num(a.tmax),tref=num(a.tref),tamb=num(a.tamb)??num(p&&p.tamb),im=num(a.imed),inn=num(a.inom),mta=num(a.mta);
 const r={tmax,tref,tamb,im,inn,mta,dtr:null,dta:null,carga:null,tcorr:null};
 if(tmax!=null&&tref!=null)r.dtr=tmax-tref;
 if(tmax!=null&&tamb!=null)r.dta=tmax-tamb;
 if(im!=null&&im>0&&inn)r.carga=im/inn;
 if(r.carga&&r.dta!=null)r.tcorr=tamb+r.dta*Math.pow(1/r.carga,2);
 r.tav=r.tcorr??tmax;
 r.margem=mta!=null&&r.tav!=null?mta-r.tav:null;
 let s=null;const up=k=>{if(s==null||RANK[k]>RANK[s])s=k};
 if(r.margem!=null){if(r.margem<=0)up('P1');else if(r.margem<=10)up('P2');else up('N')}
 if(r.dtr!=null){if(r.dtr>15)up('P1');else if(r.dtr>=4)up('P2');else if(r.dtr>=1)up('P3');else up('N')}
 if(r.dta!=null){if(r.dta>40)up('P1');else if(r.dta>20)up('P2');else if(r.dta>10)up('P3');else up('N')}
 r.sug=s;r.cls=a.cls||s;r.baixa=r.carga!=null&&r.carga<0.4;
 return r;
}
const eqNome=a=>a.eq==='out'||!EQ[a.eq]?(a.eqOutro||'Outro'):EQ[a.eq].n;

/* ========================================================= banco local */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('termo-insp',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('insp',{keyPath:'id'});d.createObjectStore('pontos',{keyPath:'id'}).createIndex('insp','inspId');d.createObjectStore('fotos',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(st,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(st,mode);let out;const r=fn(t.objectStore(st));if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const put=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const get=(st,k)=>tx(st,'readonly',s=>s.get(k));
const del=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
const getAll=st=>tx(st,'readonly',s=>s.getAll());
const pontosDe=id=>tx('pontos','readonly',s=>s.index('insp').getAll(id)).then(a=>a.sort((x,y)=>x.ordem-y.ordem));
const fotosPonto=p=>[...p.fotos,...p.achados.flatMap(a=>[...(a.fir||[]),...(a.fvis||[])])];

/* ========================================================= estado */
const S={view:'home',insp:null,cur:null,ach:null,busca:'',saveT:null,photoTarget:null};
const urls=new Map();
async function fotoURL(id){if(urls.has(id))return urls.get(id);const f=await get('fotos',id);if(!f)return '';const u=URL.createObjectURL(f.blob);urls.set(id,u);return u}
async function hidrataFotos(root=document){for(const im of root.querySelectorAll('img[data-foto]:not([src])')){im.src=await fotoURL(im.dataset.foto)}}

/* ========================================================= modal */
let modalRes=null;
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on')}
function fechaModal(v){$('#modal').classList.remove('on');$('#mbox').innerHTML='';if(modalRes){const r=modalRes;modalRes=null;r(v)}}
function ask(titulo,msg,btns){return new Promise(res=>{modalRes=res;modal(`<h3>${esc(titulo)}</h3>${msg?`<p>${msg}</p>`:''}<div class="acts">${btns.map(b=>`<button class="btn blk ${b.c||''}" data-act="mres" data-v="${b.v}">${esc(b.t)}</button>`).join('')}</div>`)})}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')fechaModal(null)});

/* ========================================================= navegação */
function go(view){if((S.view==='ponto'||S.view==='achado')&&view!=='ponto'&&view!=='achado')flush();S.view=view;render();window.scrollTo(0,0)}
function render(){const v=S.view;if(v==='home')return vHome();if(v==='insp-form')return vInspForm();if(v==='insp')return vInsp();if(v==='ponto')return vPonto();if(v==='achado')return vAchado()}
function header(titulo,sub,{back,menu}={}){
 $('#hd').innerHTML=`${back?`<button class="ib" data-act="${back}" aria-label="Voltar">←</button>`:'<div class="logo">🌡</div>'}<div class="t"><h1>${esc(titulo)}</h1>${sub?`<div class="s">${esc(sub)}</div>`:''}</div>${menu?`<button class="ib" data-act="${menu}" aria-label="Menu">⋮</button>`:''}`;
}
const badge=k=>k?`<span class="bd ${CL[k].c}">${CL[k].n}</span>`:'<span class="bd wn">—</span>';
function resumoP(p){const r={P1:0,P2:0,P3:0,N:0,tot:p.achados.length,max:null};for(const a of p.achados){const c=calc(a,p);if(c.cls)r[c.cls]++;if(c.tmax!=null&&(r.max==null||c.tmax>r.max))r.max=c.tmax}return r}

/* ---------- HOME ---------- */
async function vHome(){
 header('Termografia','Registro de anomalias térmicas',{menu:'menuHome'});
 const ins=(await getAll('insp')).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.criado-a.criado);
 const pts=await getAll('pontos');const cnt={};pts.forEach(p=>cnt[p.inspId]=(cnt[p.inspId]||0)+1);
 $('#app').innerHTML=ins.length?ins.map(i=>`<button class="it-l" data-act="abrirInsp" data-id="${i.id}"><div class="m"><b>${esc(i.cliente||'Sem cliente')}</b><span>${esc([i.unidade,fmtData(i.data)].filter(Boolean).join(' · '))}</span></div><span class="bd wn">${cnt[i.id]||0}</span></button>`).join('')
 :`<div class="empty"><b>Nenhuma inspeção ainda</b>Crie uma inspeção para começar a registrar os quadros.</div>`;
 $('#bar').innerHTML=`<button class="btn acc blk" data-act="novaInsp">+ Nova inspeção</button>`;
}
/* ---------- FORM INSPEÇÃO ---------- */
function vInspForm(){
 const i=S.insp||{};
 header(i.id?'Editar inspeção':'Nova inspeção','',{back:i.id?'voltaInsp':'home'});
 $('#app').innerHTML=`<div class="card">
 <div class="mb"><label class="lbl">Cliente</label><input class="i" id="f-cli" value="${esc(i.cliente)}" placeholder="Ex.: Saint-Gobain" autocomplete="off"></div>
 <div class="mb"><label class="lbl">Unidade / local</label><input class="i" id="f-uni" value="${esc(i.unidade)}" placeholder="Ex.: Cuiabá – fábrica" autocomplete="off"></div>

/* ---------- fotos ---------- */
async function comprime(file){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const M=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.8));
 }catch{return file}finally{URL.revokeObjectURL(url)}
}
function listaFotos(alvo){return alvo==='g'?S.cur.fotos:S.ach[alvo]}
function rerenderFotos(alvo){const el=$('#ph-'+(alvo==='g'?'geral':alvo));if(el){el.innerHTML=fotosHTML(listaFotos(alvo),alvo);hidrataFotos(el)}}
async function recebeFotos(files){

 for(const f of files){const blob=await comprime(f);const id=uid();await put('fotos',{id,blob});listaFotos(alvo).push(id)}
 rerenderFotos(alvo);if(alvo!=='g')anexaAch();agendaSalvar();
}

/* ========================================================= EXPORTAÇÃO (XLSX + fotos em ZIP) */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipBlob(files,type='application/zip'){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
 const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
 for(const f of files){const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data),sz=data.length;
  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(10,tm,true);l.setUint16(12,dt,true);l.setUint32(14,crc,true);l.setUint32(18,sz,true);l.setUint32(22,sz,true);l.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(l.buffer),nm,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz}
 const cs=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type});
}
const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xesc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function sheetXml(sh){
 const rows=[sh.cols.map(c=>c.h),...sh.rows];
 let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${sh.freeze!==false?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':''}</sheetView></sheetViews><cols>`;
 sh.cols.forEach((c,i)=>x+=`<col min="${i+1}" max="${i+1}" width="${c.w}" customWidth="1"/>`);
 x+='</cols><sheetData>';
 rows.forEach((r,ri)=>{x+=`<row r="${ri+1}"${ri===0&&sh.freeze!==false?' ht="30" customHeight="1"':''}>`;r.forEach((v,ci)=>{const ref=colL(ci)+(ri+1);const s=ri===0&&sh.freeze!==false?1:(sh.style?sh.style(ri-1,ci,v):2);
  x+=typeof v==='number'?`<c r="${ref}" s="${s}"><v>${v}</v></c>`:`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`});x+='</row>'});
 x+='</sheetData>';
 if(sh.filter&&sh.rows.length)x+=`<autoFilter ref="A1:${colL(sh.cols.length-1)}${rows.length}"/>`;
 return x+'</worksheet>';
}

const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

 if(S.view==='ponto'&&t.dataset.f){S.cur[t.dataset.f]=t.value;if(t.dataset.f==='setor')document.querySelectorAll('[data-act=setor]').forEach(x=>x.classList.toggle('on',x.dataset.v===t.value));agendaSalvar()}
 if(S.view==='achado'&&t.dataset.a){const k=t.dataset.a,a=S.ach;a[k]=t.value;
  if(k==='rec')a.recEd=true;
  if(k==='mta'){a.mtaFonte=t.value?'Informada pelo inspetor':'';$('#mtaHint').textContent=t.value?'Fonte: informada pelo inspetor':'Sem MTA: informe fabricante/modelo para pesquisar.'}
  if(k==='eqOutro'){}
  if(['tmax','tref','tamb','imed','inom','mta'].includes(k)){a.cls='';renderRes()}
  if(S.cur.achados.includes(a))agendaSalvar()}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;const ord=['f-nome','f-tag','f-setor','f-tamb'];const i=ord.indexOf(e.target.id);if(i>=0){e.preventDefault();if(i<ord.length-1)$('#'+ord[i+1]).focus();else e.target.blur()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(S.view==='ponto'||S.view==='achado'))flush()});

(async()=>{
 try{db=await openDB()}catch(e){$('#app').innerHTML='<div class="empty"><b>Armazenamento indisponível</b>Abra o app pelo Chrome, fora da aba anônima.</div>';return}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 render();
})();
</script>
